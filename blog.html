<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المقالات — Abdallah G EL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Tajawal:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#05060A; --surface:#0D0F1A; --surface-alt:#12162A; --line:#23283F;
    --text:#F3F5FB; --muted:#8A90AC; --violet:#7C5CFF; --cyan:#22D3EE; --ok:#4CD3A5;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:radial-gradient(900px 480px at 15% -10%, rgba(124,92,255,.18) 0%, transparent 60%), var(--ink);
    color:var(--text); font-family:'Tajawal', sans-serif; line-height:1.7; min-height:100vh;
  }
  .mono{ font-family:'JetBrains Mono', monospace; }
  a{ color:inherit; text-decoration:none; }
  header{ max-width:900px; margin:0 auto; padding:50px 24px 20px; }
  .back{ font-size:13px; color:var(--cyan); font-family:'JetBrains Mono', monospace; }
  header h1{ font-size:clamp(26px,5vw,38px); font-weight:900; margin-top:14px; }
  main{ max-width:900px; margin:0 auto; padding:20px 24px 60px; display:flex; flex-direction:column; gap:14px; }
  .card{
    background:var(--surface); border:1px solid var(--line); padding:22px;
    display:flex; flex-direction:column; gap:8px; transition:.2s;
  }
  .card:hover{ border-color:var(--cyan); background:var(--surface-alt); transform:translateY(-2px); }
  .card .date{ font-size:11.5px; color:var(--violet); }
  .card h2{ font-size:19px; font-weight:700; }
  .card p{ color:var(--muted); font-size:14px; }
  .empty{ color:var(--muted); padding:40px 0; text-align:center; }
</style>
</head>
<body>
<header>
  <a class="back" href="index.html">→ الرئيسية</a>
  <h1>كل المقالات</h1>
</header>
<main id="list">
  <div class="empty">جارٍ التحميل…</div>
</main>
<script>
  function esc(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  fetch('articles.json?_=' + Date.now())
    .then(r => r.json())
    .then(articles => {
      const list = document.getElementById('list');
      const sorted = [...articles].sort((a,b) => new Date(b.date) - new Date(a.date));
      if (!sorted.length) {
        list.innerHTML = '<div class="empty">لا توجد مقالات منشورة بعد.</div>';
        return;
      }
      list.innerHTML = sorted.map(a => `
        <a class="card" href="article.html?id=${encodeURIComponent(a.id)}">
          <span class="date mono">${esc(a.date || '')}</span>
          <h2>${esc(a.title)}</h2>
          <p>${esc(a.excerpt || '')}</p>
        </a>
      `).join('');
    })
    .catch(() => { document.getElementById('list').innerHTML = '<div class="empty">تعذّر تحميل المقالات.</div>'; });
</script>
</body>
</html>
