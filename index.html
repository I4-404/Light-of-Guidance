<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1LT - Abdallah G EL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#070B14;
    --card:#0F1626;
    --card-hover:#131B2E;
    --line:#212B3E;
    --text:#EAF0F7;
    --muted:#8996A8;
    --ok:#4CD3A5;
    --blue:#2F6BFF;
    --cyan:#22D3EE;
    --teal:#0EA5A0;
    --deep:#1740D6;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #0C1830 0%, var(--ink) 55%),
      var(--ink);
    color:var(--text);
    font-family:'Tajawal', sans-serif;
    line-height:1.7;
    min-height:100vh;
  }
  .mono{font-family:'JetBrains Mono', monospace;}

  header{
    max-width:900px;
    margin:0 auto;
    padding:80px 24px 50px;
    text-align:center;
  }
  .avatar-wrap{
    width:170px;
    height:170px;
    margin:0 auto 26px;
    position:relative;
  }
  .avatar-wrap::before{
    content:"";
    position:absolute;
    inset:-8px;
    border-radius:50%;
    background:conic-gradient(from 0deg, var(--blue), var(--cyan), var(--teal), var(--deep), var(--blue));
    filter:blur(2px);
    animation:spin 8s linear infinite;
    opacity:.85;
  }
  .avatar-wrap::after{
    content:"";
    position:absolute;
    inset:-8px;
    border-radius:50%;
    box-shadow:0 0 35px 4px rgba(34,211,238,.35);
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .avatar{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
    display:block;
    border:4px solid var(--ink);
    position:relative;
    z-index:1;
    background:var(--card);
  }
  .name-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-bottom:6px;
    flex-wrap:wrap;
  }
  header h1{
    font-weight:900;
    font-size:clamp(24px, 5vw, 36px);
    letter-spacing:.5px;
  }
  .verified{
    width:26px;
    height:26px;
    flex-shrink:0;
    filter:drop-shadow(0 0 6px rgba(34,211,238,.65));
    animation:verifiedPop .5s cubic-bezier(.34,1.56,.64,1) both, verifiedGlow 2.6s ease-in-out .5s infinite;
  }
  @keyframes verifiedPop{
    0%{ transform:scale(0) rotate(-25deg); opacity:0; }
    100%{ transform:scale(1) rotate(0deg); opacity:1; }
  }
  @keyframes verifiedGlow{
    0%,100%{ filter:drop-shadow(0 0 6px rgba(34,211,238,.65)); }
    50%{ filter:drop-shadow(0 0 11px rgba(34,211,238,.95)); }
  }
  header p.role{
    color:var(--cyan);
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    letter-spacing:1px;
    margin-bottom:22px;
  }
  .info-chips{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    margin-bottom:28px;
  }
  .chip{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    color:var(--muted);
    background:var(--card);
    border:1px solid var(--line);
    padding:8px 14px;
    border-radius:999px;
  }
  .chip svg{ width:15px; height:15px; flex-shrink:0; }

  .socials{
    display:flex;
    gap:14px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .wave-btn{
    position:relative;
    overflow:hidden;
    display:inline-flex;
    align-items:center;
    gap:8px;
    text-decoration:none;
    color:#04121A;
    font-weight:700;
    font-size:14px;
    padding:12px 24px;
    border-radius:14px;
    isolation:isolate;
    box-shadow:0 6px 18px -6px rgba(34,211,238,.45);
    transition:transform .2s ease;
  }
  .wave-btn:hover{ transform:translateY(-3px); }
  .wave-btn::before{
    content:"";
    position:absolute;
    inset:0;
    z-index:-2;
    background:linear-gradient(120deg,
      var(--deep) 0%, var(--blue) 20%, var(--cyan) 40%,
      var(--teal) 60%, var(--blue) 80%, var(--deep) 100%);
    background-size:300% 300%;
    animation:waveMove 6s ease-in-out infinite;
  }
  .wave-btn::after{
    content:"";
    position:absolute;
    left:-20%;
    right:-20%;
    bottom:-40%;
    height:80%;
    z-index:-1;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(255,255,255,.35) 0%, transparent 60%),
      radial-gradient(ellipse at 60% 50%, rgba(255,255,255,.25) 0%, transparent 55%),
      radial-gradient(ellipse at 90% 50%, rgba(255,255,255,.3) 0%, transparent 55%);
    animation:foamMove 3.5s ease-in-out infinite;
    opacity:.7;
  }
  @keyframes waveMove{
    0%{ background-position:0% 50%; }
    50%{ background-position:100% 50%; }
    100%{ background-position:0% 50%; }
  }
  @keyframes foamMove{
    0%{ transform:translateX(-10%) translateY(0); }
    50%{ transform:translateX(10%) translateY(-6%); }
    100%{ transform:translateX(-10%) translateY(0); }
  }
  .wave-btn svg{ width:17px; height:17px; }

  main{
    max-width:1100px;
    margin:0 auto;
    padding:20px 24px 100px;
  }
  .section-title{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:34px;
  }
  .section-title h2{
    font-size:22px;
    font-weight:700;
    white-space:nowrap;
  }
  .section-title .line{
    height:1px;
    background:var(--line);
    flex:1;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(270px, 1fr));
    gap:22px;
  }
  .app-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:22px;
    display:flex;
    flex-direction:column;
    gap:14px;
    transition:.25s;
    position:relative;
  }
  .app-card:hover{
    background:var(--card-hover);
    border-color:var(--cyan);
    transform:translateY(-4px);
  }
  .card-top{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .app-icon{
    width:54px;
    height:54px;
    border-radius:14px;
    object-fit:cover;
    background:#0F1626;
    flex-shrink:0;
  }
  .app-name{
    font-weight:700;
    font-size:17px;
  }
  .app-index{
    color:var(--muted);
    font-size:12px;
    letter-spacing:1px;
  }
  .app-desc{
    color:var(--muted);
    font-size:14px;
    flex:1;
  }
  .card-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .badge{
    font-size:11px;
    padding:4px 10px;
    border-radius:999px;
    background:rgba(76,211,165,.14);
    color:var(--ok);
    letter-spacing:.5px;
  }
  .download-btn{
    font-size:13px;
    padding:9px 18px;
    border-radius:10px;
  }

  footer{
    text-align:center;
    padding:40px 24px;
    color:var(--muted);
    font-size:13px;
    border-top:1px solid var(--line);
  }

  @media (max-width:480px){
    .card-bottom{ flex-direction:column; align-items:stretch; }
    .download-btn{ text-align:center; }
  }
</style>
</head>
